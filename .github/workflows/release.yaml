name: Build & Release Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (semver)'
        required: true
        type: string

permissions:
  contents: write


jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi

          VERSION_NAME="${TAG#v}"
          NUMERIC="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUMERIC"

          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          echo "TAG=$TAG"                    >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME"  >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE"  >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bump version in build file
        run: |
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode = $VERSION_CODE/"        app/build.gradle.kts
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): bump version to $VERSION_NAME"
            git push origin "HEAD:$(git branch --show-current)"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        id: sign-apk
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          SIGNED_FILE="${{ steps.sign-apk.outputs.signedReleaseFile }}"
          NEW_NAME="ProjectsList-v${VERSION_NAME}.apk"
          NEW_PATH="$(dirname "$SIGNED_FILE")/$NEW_NAME"
          mv "$SIGNED_FILE" "$NEW_PATH"
          echo "SIGNED_APK=$NEW_PATH" >> "$GITHUB_ENV"

      - name: Upload build outputs as artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-files
          path: ${{ env.SIGNED_APK }}

      - name: Create git tag
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ env.SIGNED_APK }}
